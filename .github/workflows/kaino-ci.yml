name: Kaino CI

# The fork's own CI. Upstream's ~100 workflows are deleted on every upstream
# merge by scripts/sync-upstream.sh; the `guard` job below fails the build if
# any of them come back, so a plain `git merge upstream/main` cannot silently
# restore them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaino-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: No upstream workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Reject reintroduced upstream workflows
        run: |
          set -euo pipefail
          strays=$(ls .github/workflows | grep -v '^kaino-' || true)
          if [ -n "$strays" ]; then
            echo "Upstream workflows are back in .github/workflows:"
            echo "$strays"
            echo
            echo "Re-run scripts/sync-upstream.sh, or delete them, and push again."
            exit 1
          fi
          echo "Only kaino-* workflows present."

  scripts:
    name: Automation self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # Offline, no network, no secrets: mocked GitHub client against the frozen
      # fixture, plus the real areas.json / MAINTAINER integrity checks.
      - run: node .github/kaino/areas.test.js
      - run: node .github/kaino/auto-assign-reviewer.test.js
      - run: node .github/kaino/pr-issue-link.test.js
      - run: node .github/kaino/duplicate-prs.test.js

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # setup.py builds the web SPA during `uv sync` unless this is set; this job
      # never serves the bundle.
      OMNIGENT_SKIP_WEB_UI: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # `--all-extras` does not work here: antigravity and cwsandbox are declared
      # conflicting extras. `--extra all` is the aggregate the project provides.
      # --locked fails on a stale lockfile instead of silently re-resolving.
      - run: uv sync --locked --extra all --group test --group lint
      # Match what pre-commit feeds ruff: tracked Python files only (its hooks
      # are types:[python], so notebook fixtures under web/ were never linted),
      # with --force-exclude so explicit paths still honour ruff's own excludes
      # for generated files like *_pb2.py.
      - run: git ls-files -z '*.py' | xargs -0 uv run ruff check --force-exclude
      - run: git ls-files -z '*.py' | xargs -0 uv run ruff format --check --force-exclude
      # The repo's type gate (pre-commit runs the same binary).
      - run: uv run pyrefly check
      # pyproject's addopts already excludes e2e / integration. `not databricks`
      # matches upstream's default lane; that extra is not installed here.
      - run: >-
          uv run pytest -q
          -m "not databricks and not nightly"
          -n 8 --dist=loadfile --timeout=300

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web type-check
      - run: pnpm -C web test
