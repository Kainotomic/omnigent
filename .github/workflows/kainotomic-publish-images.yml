# Kainotomic fork publish: builds the upstream `runtime` target and the
# two-step Kainotomic host image (deploy/kainotomic/Dockerfile.host on top of
# upstream `--target host`) and pushes both to ghcr.io/kainotomic. Upstream's
# oss-publish-images.yml is gated to omnigent-ai/omnigent and stays inert here.
#
# Tags: :sha-<short> always, plus the dispatch `tag` input or the pushed
# kainotomic-v* tag name. linux/amd64 only (Contabo). Pushes use GITHUB_TOKEN;
# the first push creates the packages private — flip visibility in the org
# package settings if anonymous pulls are wanted.
name: Publish images (Kainotomic)

on:
  push:
    tags: ['kainotomic-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag to publish alongside sha-<short> (e.g. kt1). Empty = sha tag only.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kainotomic-publish-images
  cancel-in-progress: false

env:
  SERVER_IMAGE: ghcr.io/kainotomic/omnigent-server
  HOST_IMAGE: ghcr.io/kainotomic/omnigent-host
  OPENCODE_VERSION: 1.18.30

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # ubuntu-latest leaves ~14 GB free; the host base (3.8 GB) + overlay
      # (4.9 GB) + server image + build cache need more. Drop preinstalled
      # toolchains this job never uses.
      - name: Free runner disk
        run: |
          set -euo pipefail
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -n 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        with:
          # docker driver: the host-base image must be loadable locally so
          # Dockerfile.host's FROM can resolve it without a registry round trip.
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          TAGS="${SERVER_IMAGE}:sha-${SHORT_SHA}"
          HOST_TAGS="${HOST_IMAGE}:sha-${SHORT_SHA}"
          EXTRA=""
          if [[ "${GH_REF}" == refs/tags/kainotomic-v* ]]; then
            EXTRA="${GH_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            EXTRA="${INPUT_TAG}"
          fi
          if [ -n "${EXTRA}" ]; then
            [[ "${EXTRA}" =~ ^[A-Za-z0-9_.-]{1,128}$ ]] || { echo "invalid tag '${EXTRA}'" >&2; exit 1; }
            TAGS="${TAGS},${SERVER_IMAGE}:${EXTRA}"
            HOST_TAGS="${HOST_TAGS},${HOST_IMAGE}:${EXTRA}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "host_tags=${HOST_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.full_sha }}
          provenance: false

      # Step 1 of the host image: upstream host target, loaded into the local
      # docker daemon (not pushed) so Dockerfile.host can FROM it.
      - name: Build host base image (local)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: host
          load: true
          push: false
          platforms: linux/amd64
          tags: omnigent-host-base:${{ steps.tags.outputs.short_sha }}
          build-args: |
            EXTRA_HARNESS_CLIS=opencode@${{ env.OPENCODE_VERSION }}
          provenance: false

      # Step 2: the Kainotomic overlay (pinned CLIs, tini, templates, entrypoint).
      - name: Build and push host image
        id: build-host
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/kainotomic/Dockerfile.host
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.host_tags }}
          build-args: |
            BASE_IMAGE=omnigent-host-base:${{ steps.tags.outputs.short_sha }}
            OMNIGENT_SOURCE_REVISION=${{ steps.tags.outputs.full_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.full_sha }}
          provenance: false

      - name: Report digests
        run: |
          echo "server: ${SERVER_IMAGE}@${{ steps.build-server.outputs.digest }}"
          echo "host:   ${HOST_IMAGE}@${{ steps.build-host.outputs.digest }}"
